name: build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

  schedule:
    - cron: "0 1 * * Sun"

concurrency:
  group: build ${{ github.ref }}
  cancel-in-progress: true

env:
  image-name: webtrees
  registry: ghcr.io

jobs:
  docker-run:
    runs-on: ubuntu-latest
    name: Build webtrees

    strategy:
      fail-fast: false
  
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.registry }}/${{ github.repository_owner }}/${{ env.image-name }}
          tags: |
            type=ref,enable=true,priority=600,prefix=pr-,suffix=,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build docker
      - name: Docker build
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.registry }}/${{ github.repository_owner }}/${{ env.image-name }}:latest
          labels: ${{ steps.docker_meta.outputs.labels }}
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          file: Dockerfile
          context: .
          platforms: 'linux/amd64,linux/arm64'
          build-args: |
            VARIANT=latest

      - name: Attest
        uses: actions/attest@v4
        id: attest
        if: ${{ github.event_name != 'pull_request' }}
        with:
          subject-name: ${{ env.registry }}/${{ github.repository_owner }}/${{ env.image-name }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
