name: build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

  schedule:
    - cron: "0 1 * * Sun"

concurrency:
  group: build ${{ github.ref }}
  cancel-in-progress: true

env:
  image-name: webtrees
  registry: ghcr.io
  dockerhub-image: docker.io/asbin/webtrees
  # PHP version and variant the tags without them point to
  default-php: 8.5
  default-variant: apache

jobs:
  infos:
    runs-on: ubuntu-latest
    name: Info
    outputs:
      latest: ${{ steps.infos.outputs.latest }}
    steps:
      - name: Get release info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: infos
        with:
          script: |
            // get all releases
            // paginate through releases if needed (per_page=100)
            let allReleases = [];
            let page = 1;
            while (true) {
              const response = await github.rest.repos.listReleases({
                owner: 'fisharebest',
                repo: 'webtrees',
                per_page: 100,
                page: page
              });
              allReleases = allReleases.concat(response.data);
              if (response.data.length < 100) break;
              page++;
            }

            // number of releases
            console.log(`Found ${allReleases.length} releases`);

            // sort by version (semantic release)
            allReleases.sort((a, b) => {
              const versionA = a.tag_name.replace(/^v/, '').split('.').map(Number);
              const versionB = b.tag_name.replace(/^v/, '').split('.').map(Number);
              for (let i = 0; i < Math.max(versionA.length, versionB.length); i++) {
                const diff = (versionA[i] || 0) - (versionB[i] || 0);
                if (diff !== 0) return diff;
              }
              return 0;
            });

            // latest release
            console.log(`Latest release: ${allReleases[allReleases.length - 1].tag_name}`);
            core.setOutput("latest", allReleases[allReleases.length - 1].tag_name);


  docker-run:
    runs-on: ubuntu-latest
    name: Build webtrees (PHP ${{ matrix.php-version }}, ${{ matrix.variant }})
    needs: infos

    strategy:
      fail-fast: false
      matrix:
        php-version: [8.4, 8.5]
        variant: [apache, fpm]
  
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.registry }}/${{ github.repository_owner }}/${{ env.image-name }}
            ${{ env.dockerhub-image }}
          # <version>-php<php>-<variant> for every build, <version>-<variant> and <variant> for the
          # default PHP version. The tags without a variant point to the default variant (apache).
          tags: |
            type=ref,enable=true,priority=600,prefix=pr-,suffix=-php${{ matrix.php-version }}-${{ matrix.variant }},event=pr
            type=raw,value=${{ needs.infos.outputs.latest }}-php${{ matrix.php-version }}-${{ matrix.variant }}
            type=raw,value=${{ needs.infos.outputs.latest }}-php${{ matrix.php-version }},enable=${{ matrix.variant == env.default-variant }}
            type=raw,value=${{ needs.infos.outputs.latest }}-${{ matrix.variant }},enable=${{ github.ref == 'refs/heads/main' && matrix.php-version == env.default-php }}
            type=raw,value=${{ matrix.variant }},enable=${{ github.ref == 'refs/heads/main' && matrix.php-version == env.default-php }}
            type=raw,value=${{ needs.infos.outputs.latest }},enable=${{ github.ref == 'refs/heads/main' && matrix.php-version == env.default-php && matrix.variant == env.default-variant }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.php-version == env.default-php && matrix.variant == env.default-variant }}
          labels: |
            maintainer=${{ github.repository_owner }}
            org.opencontainers.image.title="webtrees"
            org.opencontainers.image.description="webtrees Docker image"
            org.opencontainers.image.version=${{ needs.infos.outputs.latest }}
            org.opencontainers.image.url="https://github.com/${{ github.repository_owner }}/${{ github.repository }}"
            org.opencontainers.image.source="https://github.com/${{ github.repository_owner }}/${{ github.repository }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only when pushing: the secrets are not available to pull requests from forks
      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image into the local Docker engine and test it before pushing anything
      - name: Docker build for tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          push: false
          tags: webtrees:test
          cache-from: type=gha
          file: Dockerfile
          context: .
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            VARIANT=${{ matrix.variant }}
            WEBTREES_VERSION=${{ needs.infos.outputs.latest }}

      - name: Test image
        run: tests/run.sh webtrees:test ${{ matrix.variant }}

      # Build docker: the layers come from the cache of the build above
      - name: Docker build
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          file: Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          # platforms: 'linux/amd64,linux/arm64'
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            VARIANT=${{ matrix.variant }}
            WEBTREES_VERSION=${{ needs.infos.outputs.latest }}

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          subject-name: ${{ env.registry }}/${{ github.repository_owner }}/${{ env.image-name }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      - name: Attest (Docker Hub)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          subject-name: ${{ env.dockerhub-image }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      - name: Docker Scout
        id: docker-scout
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/scout-action@v1
        with:
          command: compare
          image: ${{ env.dockerhub-image }}:${{ matrix.variant }}
          to-env: production
          ignore-unchanged: true
          only-severities: critical,high
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
