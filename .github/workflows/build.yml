name: build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

  schedule:
    - cron: "0 1 * * Sun"

concurrency:
  group: build ${{ github.ref }}
  cancel-in-progress: true

env:
  image-name: webtrees
  registry: ghcr.io

jobs:
  infos:
    runs-on: ubuntu-latest
    name: Info
    outputs:
      latest: ${{ steps.infos.outputs.latest }}
    steps:
      - name: Get release info
        uses: actions/github-script@v6
        id: infos
        with:
          script: |
            // get all releases
            // paginate through releases if needed (per_page=100)
            let allReleases = [];
            let page = 1;
            while (true) {
              const response = await github.rest.repos.listReleases({
                owner: 'fisharebest',
                repo: 'webtrees',
                per_page: 100,
                page: page
              });
              allReleases = allReleases.concat(response.data);
              if (response.data.length < 100) break;
              page++;
            }

            // number of releases
            console.log(`Found ${allReleases.length} releases`);

            // sort by version (semantic release)
            allReleases.sort((a, b) => {
              const versionA = a.tag_name.replace(/^v/, '').split('.').map(Number);
              const versionB = b.tag_name.replace(/^v/, '').split('.').map(Number);
              for (let i = 0; i < Math.max(versionA.length, versionB.length); i++) {
                const diff = (versionA[i] || 0) - (versionB[i] || 0);
                if (diff !== 0) return diff;
              }
              return 0;
            });

            // latest release
            console.log(`Latest release: ${allReleases[allReleases.length - 1].tag_name}`);
            core.setOutput("latest", allReleases[allReleases.length - 1].tag_name);


  docker-run:
    runs-on: ubuntu-latest
    name: Build webtrees
    needs: infos

    strategy:
      fail-fast: false
      matrix:
        php-version: [8.4, 8.5]
  
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.registry }}/${{ github.repository_owner }}/${{ env.image-name }}
          tags: |
            type=ref,enable=true,priority=600,prefix=pr-,suffix=,event=pr
            type=raw,value=${{ matrix.php-version }},enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.infos.outputs.latest }}
          labels: |
            maintainer=${{ github.repository_owner }}
            org.opencontainers.image.title="webtrees"
            org.opencontainers.image.description="webtrees Docker image"
            org.opencontainers.image.version=${{ needs.infos.outputs.latest }}
            org.opencontainers.image.url="https://github.com/${{ github.repository_owner }}/${{ github.repository }}"
            org.opencontainers.image.source="https://github.com/${{ github.repository_owner }}/${{ github.repository }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build docker
      - name: Docker build
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.registry }}/${{ github.repository_owner }}/${{ env.image-name }}:latest
          labels: ${{ steps.docker_meta.outputs.labels }}
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          file: Dockerfile
          context: .
          platforms: 'linux/amd64,linux/arm64'
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            WEBTREES_VERSION=${{ needs.infos.outputs.latest }}

      - name: Attest
        uses: actions/attest@v4
        id: attest
        if: ${{ github.event_name != 'pull_request' }}
        with:
          subject-name: ${{ env.registry }}/${{ github.repository_owner }}/${{ env.image-name }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
