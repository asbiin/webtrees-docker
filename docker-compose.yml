services:
  app:
    build: .
    depends_on:
      - db
    environment:
      PRETTY_URLS: "1"
      LANG: "en"
      BASE_URL: "http://localhost:8080"
      DB_TYPE: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "webtrees"
      DB_PASS: "webtrees"
      DB_NAME: "webtrees"
      DB_PREFIX: "wt_"
      WT_USER: "admin"
      WT_NAME: "Administrator"
      WT_PASS: "changeme"
      WT_EMAIL: "none@example.com"
      PUID: "1000"
      PGID: "1000"
    ports:
      - 8080:80
    restart: unless-stopped

  db:
    image: mariadb:12
    environment:
      MARIADB_DATABASE: "webtrees"
      MARIADB_USER: "webtrees"
      MARIADB_PASSWORD: "webtrees"
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
    restart: unless-stopped
