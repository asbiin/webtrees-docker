# webtrees with a MariaDB database, served over plain HTTP on port 8080.
#
# The usual setup on a home server or a NAS, or behind a reverse proxy that
# already runs on the host (nginx, Caddy, Apache...) and forwards to port 8080.
#
#   docker compose up -d
#   open http://localhost:8080 and log in as admin / changeme
#
# Put DB_PASSWORD and WT_PASS in a .env file next to this one to override the
# default passwords.

services:
  webtrees:
    image: ghcr.io/asbiin/webtrees:latest
    # To run an image built from this repository instead:
    # build: ../..
    depends_on:
      db:
        # webtrees writes its configuration on the first start, which needs a
        # database that already accepts connections.
        condition: service_healthy
    environment:
      BASE_URL: "http://localhost:8080"
      PRETTY_URLS: "1"
      LANG: "en-US"
      DB_TYPE: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "webtrees"
      DB_PASS: "${DB_PASSWORD:-webtrees}"
      DB_NAME: "webtrees"
      DB_PREFIX: "wt_"
      # Initial administrator, created on the very first start only
      WT_USER: "admin"
      WT_NAME: "Administrator"
      WT_PASS: "${WT_PASS:-changeme}"
      WT_EMAIL: "admin@example.com"
    ports:
      - "8080:80"
    volumes:
      - webtrees-data:/var/www/html/data
      # Third-party modules, see https://webtrees.net/download/modules
      # - webtrees-modules:/var/www/html/modules_v4
    restart: unless-stopped

  db:
    image: mariadb:12
    environment:
      MARIADB_DATABASE: "webtrees"
      MARIADB_USER: "webtrees"
      MARIADB_PASSWORD: "${DB_PASSWORD:-webtrees}"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  webtrees-data:
  # webtrees-modules:
  db-data:
