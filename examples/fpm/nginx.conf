# nginx in front of the PHP-FPM image of webtrees.
#
# nginx serves the static files from public/, a volume shared with the webtrees
# service, and hands every other request to webtrees over FastCGI. Nothing else
# of /var/www/html is visible to nginx, so data/ cannot be downloaded.

server {
    listen 80;
    server_name _;

    root /var/www/html;

    # Match PHP_UPLOAD_LIMIT of the webtrees service.
    client_max_body_size 512M;

    # Take the visitor address from the X-Real-IP header sent by a reverse
    # proxy, as the Apache image does, but only from private networks.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    location /public/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location / {
        include fastcgi_params;
        # webtrees has a single entry point, which also routes pretty URLs.
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # Importing a large GEDCOM file can take a while.
        fastcgi_read_timeout 300s;
        fastcgi_pass webtrees:9000;
    }
}
