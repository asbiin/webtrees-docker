# webtrees on PHP-FPM, behind nginx, with a MariaDB database.
#
# The fpm image runs PHP only: nginx serves the static files and forwards the
# rest to webtrees over FastCGI (see nginx.conf). Pick it to run your own web
# server; otherwise the Apache image (../mariadb) is simpler.
#
#   docker compose up -d
#   open http://localhost:8080 and log in as admin / changeme
#
# To replace the default passwords, copy .env.example to .env and fill it in
# before the first start.

services:
  web:
    image: nginx:stable
    depends_on:
      - webtrees
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - webtrees-public:/var/www/html/public:ro
    restart: unless-stopped

  webtrees:
    image: ghcr.io/asbiin/webtrees:fpm
    # To run an image built from this repository instead:
    # build:
    #   context: ../..
    #   args:
    #     VARIANT: fpm
    depends_on:
      db:
        # webtrees writes its configuration on the first start, which needs a
        # database that already accepts connections.
        condition: service_healthy
    environment:
      BASE_URL: "http://localhost:8080"
      PRETTY_URLS: "1"
      LANG: "en-US"
      DB_TYPE: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "webtrees"
      DB_PASS: "${DB_PASSWORD:-webtrees}"
      DB_NAME: "webtrees"
      DB_PREFIX: "wt_"
      # Initial administrator, created on the very first start only
      WT_USER: "admin"
      WT_NAME: "Administrator"
      WT_PASS: "${WT_PASS:-changeme}"
      WT_EMAIL: "admin@example.com"
    volumes:
      - webtrees-data:/var/www/html/data
      # Static files, served by nginx. The entrypoint refreshes them when the
      # image holds another webtrees version.
      - webtrees-public:/var/www/html/public
      # Third-party modules, see https://webtrees.net/download/modules
      # - webtrees-modules:/var/www/html/modules_v4
    restart: unless-stopped

  db:
    image: mariadb:12
    environment:
      MARIADB_DATABASE: "webtrees"
      MARIADB_USER: "webtrees"
      MARIADB_PASSWORD: "${DB_PASSWORD:-webtrees}"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  webtrees-data:
  webtrees-public:
  # webtrees-modules:
  db-data:
